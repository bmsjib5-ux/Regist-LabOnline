services:
  - type: web
    name: regist-labonline
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NOTION_TOKEN
        sync: false
      - key: DATABASE_ID
        sync: false
